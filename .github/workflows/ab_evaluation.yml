name: A/B Routing Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'  # daily at 06:30 UTC (small N)
    - cron: '0 7 * * 1'   # weekly Monday at 07:00 UTC (larger N)

jobs:
  ab-eval-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A/B evaluator (small N)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ] && [ -z "${{ secrets.HUGGINGFACE_TOKEN }}" ]; then
            echo "Skipping A/B evaluator: missing HF/HUGGINGFACE tokens";
          else
            PYTHONPATH=. python scripts/ab_routing_eval.py --domains frontend research backend --per-domain 2 --provider qwen3;
          fi

      - name: Upload A/B report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-routing-eval-reports-daily
          path: |
            logs/ab_eval_*.json
            logs/ab_eval_*.csv
            logs/ab_eval_diff_*.csv
          if-no-files-found: ignore

      - name: Routing decisions summary (last 200)
        if: always()
        run: |
          PYTHONPATH=. python scripts/routing_decisions_summary.py --limit 200 || true

      - name: Upload routing summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-decisions-summary-daily
          path: |
            logs/routing_summary_*.md
            logs/routing_summary_*.json
          if-no-files-found: ignore

  ab-eval-weekly:
    if: github.event.schedule == '0 7 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A/B evaluator (larger N)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ] && [ -z "${{ secrets.HUGGINGFACE_TOKEN }}" ]; then
            echo "Skipping A/B evaluator (weekly): missing HF/HUGGINGFACE tokens";
          else
            PYTHONPATH=. python scripts/ab_routing_eval.py --domains frontend research backend --per-domain 10 --provider qwen3;
          fi

      - name: Upload A/B report artifacts (weekly)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-routing-eval-reports-weekly
          path: |
            logs/ab_eval_*.json
            logs/ab_eval_*.csv
            logs/ab_eval_diff_*.csv
          if-no-files-found: ignore

      - name: Routing decisions summary (last 500)
        if: always()
        run: |
          PYTHONPATH=. python scripts/routing_decisions_summary.py --limit 500

      - name: Upload routing summary artifacts (weekly)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-decisions-summary-weekly
          path: |
            logs/routing_summary_*.md
            logs/routing_summary_*.json
          if-no-files-found: ignore

