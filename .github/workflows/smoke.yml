name: Smoke Tests (Non-Dry-Run)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests (non-dry-run)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          PYTHONPATH=. pytest tests/integration/test_build_rag_patterns_smoke.py -v --junitxml=pytest_smoke.xml

      - name: Upload smoke logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-logs
          path: |
            logs/
          if-no-files-found: ignore

      - name: Upload smoke JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-junit
          path: pytest_smoke.xml
          if-no-files-found: ignore

