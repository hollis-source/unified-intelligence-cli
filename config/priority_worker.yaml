# Priority Worker Configuration Template
# Generated by ULTRATHINK (backend-lead agent) on 2025-10-04

priority_worker:
  # Daemon configuration
  daemon:
    cycle_hours: 24        # Main loop cycle duration (default: 24 hours)
    max_retries: 3        # Maximum retries for failed operations
    base_delay: 1.0       # Base delay for exponential backoff (seconds)

  # Redis configuration (for atomic locking)
  redis:
    host: localhost
    port: 6379
    db: 0                 # Redis database number

  # Git configuration (for branch management)
  git:
    repo_path: /home/ui-cli_jake/autonomous-task-agent-dev-orchestration
    branch_prefix: priority-worker  # Prefix for created branches

  # DSL executor configuration (for workflow execution)
  dsl:
    cwd: /home/ui-cli_jake/autonomous-task-agent-dev-orchestration
    timeout: 300          # Subprocess timeout in seconds
    executor_cmd: python3 -m src.dsl.cli_integration

  # Logging configuration
  logging:
    level: INFO           # DEBUG, INFO, WARNING, ERROR, CRITICAL
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

  # Priority queue configuration (task polling)
  priority_queue:
    queue_file: config/priorities.yaml  # Path to priorities YAML file
