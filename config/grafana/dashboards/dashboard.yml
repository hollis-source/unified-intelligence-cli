# Grafana Dashboard Provisioning
# Sprint 1: Production Deployment

apiVersion: 1

providers:
  - name: 'Project Builder'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
