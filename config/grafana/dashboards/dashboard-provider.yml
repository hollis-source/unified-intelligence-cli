# Grafana Dashboard Provisioning Configuration
# Auto-loads dashboards from /etc/grafana/provisioning/dashboards/*.json

apiVersion: 1

providers:
  - name: 'Project Builder Dashboards'
    orgId: 1
    folder: 'Project Builder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
