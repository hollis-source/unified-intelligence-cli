id: test-12
agent: test
prompt: |
  Write snapshot tests for API responses and UI templates (if applicable). Ensure snapshots
  are readable and updated intentionally. Validate that only expected fields change between
  versions.

  Requirements:
  - Human-readable snapshot formatting
  - Stable ordering of keys/fields
  - Clear review process for snapshot updates

  Expected files to reference:
  - tests/snapshots/test_api_snapshots.py (API snapshot tests)
  - tests/snapshots/__snapshots__/test_api_snapshots/test_product_list.json (snapshot file)
  - tests/helpers/snapshot_helpers.py (snapshot serialization helpers)
  - pytest.ini (snapshot configuration)

  Example of proper file:line references:
  - tests/snapshots/test_api_snapshots.py:8 (def test_product_list_snapshot)
  - tests/snapshots/__snapshots__/test_api_snapshots/test_product_list.json:1 (product list snapshot)
  - tests/helpers/snapshot_helpers.py:12 (def serialize_json with sorted keys)
  - pytest.ini:8 (snapshot_update = --snapshot-update flag)

  Deliverables:
  1. tests/snapshots/test_api_snapshots.py
  2. Snapshot files committed with review notes
  - MANDATORY: Your response MUST include at least 3 file:line references to snapshot test files
  - MANDATORY: Include pytest-snapshot patterns with JSON serialization, sorted keys, and snapshot update workflow

  Snapshot Test Template (use this structure):
  ```python
  # tests/snapshots/test_api_snapshots.py
  import pytest
  import json

  def test_product_list_snapshot(snapshot, client):
      """Test product list API response matches snapshot"""
      response = client.get('/api/products')

      # Sort for stability
      data = response.json()
      data['products'] = sorted(data['products'], key=lambda p: p['id'])

      # Serialize with stable formatting
      snapshot_data = json.dumps(data, indent=2, sort_keys=True)
      snapshot.assert_match(snapshot_data, 'test_product_list.json')

  def test_product_detail_snapshot(snapshot, client):
      """Test product detail API response matches snapshot"""
      response = client.get('/api/products/1')

      data = response.json()
      # Remove timestamp fields that change
      data.pop('updated_at', None)

      snapshot_data = json.dumps(data, indent=2, sort_keys=True)
      snapshot.assert_match(snapshot_data, 'test_product_detail.json')

  # tests/helpers/snapshot_helpers.py
  import json
  from datetime import datetime

  def serialize_for_snapshot(data, exclude_fields=None):
      """Serialize data for stable snapshot comparison"""
      exclude_fields = exclude_fields or ['created_at', 'updated_at', 'id']

      def remove_excluded(obj):
          if isinstance(obj, dict):
              return {k: remove_excluded(v) for k, v in obj.items() if k not in exclude_fields}
          elif isinstance(obj, list):
              return [remove_excluded(item) for item in sorted(obj, key=str)]
          return obj

      cleaned = remove_excluded(data)
      return json.dumps(cleaned, indent=2, sort_keys=True)

  # tests/snapshots/__snapshots__/test_api_snapshots/test_product_list.json
  {
    "count": 3,
    "products": [
      {
        "id": 1,
        "name": "Laptop",
        "price": 999.99,
        "stock": 10
      },
      {
        "id": 2,
        "name": "Mouse",
        "price": 29.99,
        "stock": 50
      }
    ]
  }

  # pytest.ini
  [pytest]
  addopts = --snapshot-warn-unused
  ```

  Snapshot update workflow:
  ```bash
  # 1. Run tests - failures show diffs
  pytest tests/snapshots/

  # 2. Review changes carefully
  git diff tests/snapshots/__snapshots__/

  # 3. If changes are intentional, update snapshots
  pytest tests/snapshots/ --snapshot-update

  # 4. Commit updated snapshots with explanation
  git add tests/snapshots/__snapshots__/
  git commit -m "Update API snapshots: added discount_price field"
  ```

  Expected patterns:
  - Sorted output: sort_keys=True, sorted(items, key=...)
  - Stable serialization: json.dumps with indent, exclude timestamps
  - pytest-snapshot: snapshot.assert_match()
  - Review process: git diff before --snapshot-update

checks:
  - type: regex
    pattern: '\b(snapshot|golden\s*files?)\b'
    description: Uses snapshot/golden file testing
  - type: regex
    pattern: '\b(API|response|template)\b'
    description: Targets API or template outputs
  - type: regex
    pattern: '\b(stable|deterministic|ordering)\b'
    description: Ensures deterministic ordering for stability

acceptance:
  auto_min: 6
  human_min: 6
  required_checks: all

metadata:
  difficulty: medium
  estimated_tokens: 3600
  tags: [testing, snapshots, api]
