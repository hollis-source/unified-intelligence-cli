  # utils/date.py (AFTER - with zoneinfo)
  from datetime import datetime, timezone
  from zoneinfo import ZoneInfo, ZoneInfoNotFoundError
  from typing import Optional

  class InvalidTimezoneError(ValueError):
      """Raised when an invalid timezone string is provided."""
      pass

  def get_user_local_time(
      utc_time: datetime,
      timezone_str: str
  ) -> datetime:
      """
      Convert a UTC datetime to a localized datetime.

      Args:
          utc_time: UTC datetime (must be timezone-aware)
          timezone_str: IANA timezone name (e.g., 'America/New_York')

      Returns:
          Localized datetime in the target timezone

      Raises:
          InvalidTimezoneError: If timezone_str is invalid
          ValueError: If utc_time is None or naive
      """
      if utc_time is None:
          raise ValueError("utc_time cannot be None")

      if utc_time.tzinfo is None:
          raise ValueError("utc_time must be timezone-aware")

      try:
          tz = ZoneInfo(timezone_str)
      except ZoneInfoNotFoundError:
          raise InvalidTimezoneError(
              f"Invalid timezone: {timezone_str}. "
              f"Use IANA timezone names (e.g., 'America/New_York')"
          )

      return utc_time.astimezone(tz)

  def format_for_display(
      dt: datetime,
      timezone_str: str,
      format_str: str = '%Y-%m-%d %H:%M:%S %Z'
  ) -> str:
      """
      Format a datetime for display in a specific timezone.

      Args:
          dt: Datetime to format (UTC or timezone-aware)
          timezone_str: Target IANA timezone
          format_str: strftime format string

      Returns:
          Formatted datetime string

      Raises:
          InvalidTimezoneError: If timezone_str is invalid
      """
      if dt.tzinfo is None:
          # Assume naive datetime is UTC
          dt = dt.replace(tzinfo=timezone.utc)

      local = get_user_local_time(dt, timezone_str)
      return local.strftime(format_str)

  def now_in_timezone(timezone_str: str) -> datetime:
      """
      Get current time in a specific timezone.

      Args:
          timezone_str: IANA timezone name

      Returns:
          Current datetime in target timezone

      Raises:
          InvalidTimezoneError: If timezone_str is invalid
      """
      utc_now = datetime.now(timezone.utc)
      return get_user_local_time(utc_now, timezone_str)

  # tests/test_date_utils.py
  import pytest
  from datetime import datetime, timezone
  from utils.date import (
      get_user_local_time,
      format_for_display,
      now_in_timezone,
      InvalidTimezoneError
  )

  def test_get_user_local_time_valid_timezone():
      """Test conversion to valid timezone"""
      utc_time = datetime(2024, 1, 15, 12, 0, 0, tzinfo=timezone.utc)
      ny_time = get_user_local_time(utc_time, 'America/New_York')

      assert ny_time.hour == 7  # EST is UTC-5
      assert ny_time.tzinfo is not None

  def test_invalid_timezone_raises_error():
      """Test that invalid timezone raises custom error"""
      utc_time = datetime(2024, 1, 15, 12, 0, 0, tzinfo=timezone.utc)

      with pytest.raises(InvalidTimezoneError) as exc_info:
          get_user_local_time(utc_time, 'Invalid/Timezone')

      assert "Invalid timezone" in str(exc_info.value)

  def test_none_utc_time_raises_error():
      """Test that None utc_time raises ValueError"""
      with pytest.raises(ValueError) as exc_info:
          get_user_local_time(None, 'America/New_York')

      assert "cannot be None" in str(exc_info.value)

  def test_naive_datetime_raises_error():
      """Test that naive datetime raises ValueError"""
      naive_time = datetime(2024, 1, 15, 12, 0, 0)

      with pytest.raises(ValueError) as exc_info:
          get_user_local_time(naive_time, 'America/New_York')

      assert "must be timezone-aware" in str(exc_info.value)

  def test_format_for_display():
      """Test datetime formatting"""
      utc_time = datetime(2024, 1, 15, 12, 0, 0, tzinfo=timezone.utc)
      formatted = format_for_display(utc_time, 'America/New_York')

      assert '2024-01-15 07:00:00 EST' in formatted
  ```

  Expected patterns:
  - zoneinfo: from zoneinfo import ZoneInfo, ZoneInfoNotFoundError
  - Type hints: def func(...) -> datetime
  - Error handling: try/except ZoneInfoNotFoundError, custom exceptions
  - Docstrings: Google style with Args, Returns, Raises
  - Edge cases: None checks, naive datetime detection
  - IANA timezones: 'America/New_York', 'Europe/London', 'Asia/Tokyo'

