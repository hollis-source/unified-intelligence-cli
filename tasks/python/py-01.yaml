  # utils/date.py (BEFORE - with pytz)
  import pytz
  from datetime import datetime

  def get_user_local_time(utc_time, timezone_str):
      tz = pytz.timezone(timezone_str)
      return utc_time.replace(tzinfo=pytz.utc).astimezone(tz)

