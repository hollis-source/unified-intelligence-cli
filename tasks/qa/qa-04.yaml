id: qa-04
agent: qa
prompt: |
  Design a smoke testing suite for the REST API endpoints of a social media application.

  API Context:
  - User management: /api/users (GET, POST, PUT, DELETE)
  - Posts: /api/posts (GET, POST, PUT, DELETE)
  - Comments: /api/posts/{id}/comments (GET, POST, DELETE)
  - Authentication: /api/auth/login, /api/auth/logout, /api/auth/refresh
  - Media uploads: /api/media (POST multipart/form-data)
  - Search: /api/search?q={query}&type={user|post}

  Requirements:
  1. Define critical path smoke tests (10-15 test cases)
  2. Prioritize tests by business impact (P0 = critical, P1 = important, P2 = nice-to-have)
  3. Include happy path tests for core workflows
  4. Specify expected response codes and validation criteria
  5. Estimate total smoke test execution time
  6. MANDATORY: Your response MUST include at least 3 file:line references to existing code

  Expected files to reference:
  - tests/smoke/api_smoke_tests.py (smoke test implementation)
  - src/api/routes/users.py (user API routes)
  - src/api/routes/posts.py (posts API routes)
  - tests/fixtures/api_data.json (test data)

checks:
  - "smoke test"
  - "critical path"
  - "priority"
  - "response code"
