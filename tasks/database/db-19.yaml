  -- Delete entities for changed file (within transaction)
  BEGIN TRANSACTION;

  DELETE FROM entities
  WHERE file_path = $file_path;

  COMMIT TRANSACTION;

  -- Insert new entities (batch)
  INSERT INTO entities [
      {
          entity_id: "func_123",
          entity_type: "function",
          file_path: "src/main.py",
          content: "def example(): pass",
          embedding: [0.1, 0.2, ...],
          indexed_at: time::now()
      },
      ...
  ];
  ```

