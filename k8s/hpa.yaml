apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-builder
  namespace: project-builder
  labels:
    app.kubernetes.io/name: project-builder
    app.kubernetes.io/part-of: project-builder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-builder
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

