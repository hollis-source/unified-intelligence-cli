# Production Docker Compose for Project Builder
# Sprint 1: Production Deployment (SurrealDB Migration)
# Includes: SurrealDB, Prometheus, Grafana, Project Builder

version: '3.8'

services:
  # SurrealDB - Multi-model database (Graph + Document + Vector + Relational)
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: project-builder-db
    user: "0:0"  # Run as root to avoid volume permission issues
    command:
      - start
      - --log=info
      - --user=root
      - --pass=${PB_DB_PASSWORD:-changeme}
      - file:/data/database.db
    environment:
      - SURREAL_LOG=info
    volumes:
      - surrealdb-data:/data
      - ./scripts/init-surreal.surql:/init/init.surql:ro
    ports:
      - "8001:8000"  # SurrealDB HTTP/WebSocket API
    networks:
      - pb-network
    restart: unless-stopped
    # Healthcheck disabled: SurrealDB uses distroless image with no shell/utilities
    # Service health verified via external connectivity testing
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Redis - LLM Cache
  redis:
    image: redis:7-alpine
    container_name: project-builder-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - pb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Project Builder - Main application service
  project-builder:
    build:
      context: .
      dockerfile: Dockerfile.project-builder
    image: project-builder:latest
    container_name: project-builder
    environment:
      # SurrealDB connection
      - PB_DB_TYPE=surrealdb
      - PB_DB_HOST=surrealdb
      - PB_DB_PORT=8000
      - PB_DB_NAMESPACE=project_builder
      - PB_DB_DATABASE=production
      - PB_DB_USER=root
      - PB_DB_PASSWORD=${PB_DB_PASSWORD:-changeme}
      - SURREALDB_URL=http://surrealdb:8000
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - LLM_CACHE_ENABLED=true
      # LLM Provider API keys
      - XAI_API_KEY=${XAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      # SSH/FileStore
      - PB_SSH_KEY_PATH=/home/pbuser/.ssh/id_ed25519
      - PB_SSH_KNOWN_HOSTS=/home/pbuser/.ssh/known_hosts
      # Application configuration
      - PB_ENV=production
      - PB_LOG_LEVEL=${PB_LOG_LEVEL:-INFO}
      - PB_LOG_FORMAT=json
      # Prometheus metrics
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=8000
    volumes:
      # Persistent storage for projects and artifacts
      - project-artifacts:/app/projects
      - project-logs:/app/logs
      # Read-only config
      - ./config:/app/config:ro
      # SSH keys (read-only bind mount - see docs for setup)
      # - /srv/pb/.ssh:/home/pbuser/.ssh:ro
    ports:
      - "8000:8000"  # Health check + Prometheus metrics
    networks:
      - pb-network
    depends_on:
      surrealdb:
        condition: service_started  # Changed: SurrealDB has no healthcheck (distroless)
      redis:
        condition: service_healthy  # Redis has proper healthcheck
    command: ["sh", "-c", "./wait-for.sh http://surrealdb:8000/health && python scripts/run-health-server.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
      replicas: 1
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: project-builder-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: project-builder-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - pb-network
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  pb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  surrealdb-data:
    driver: local
  redis-data:
    driver: local
  project-artifacts:
    driver: local
  project-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
