# Production Docker Compose for Project Builder
# Sprint 1: Production Deployment
# Includes: PostgreSQL, Prometheus, Grafana, Project Builder

version: '3.8'

services:
  # PostgreSQL - Production database for state management
  postgres:
    image: postgres:16-alpine
    container_name: project-builder-db
    environment:
      POSTGRES_DB: project_builder
      POSTGRES_USER: pb_user
      POSTGRES_PASSWORD: ${PB_DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - pb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb_user -d project_builder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Project Builder - Main application service
  project-builder:
    build:
      context: .
      dockerfile: Dockerfile.project-builder
    image: project-builder:latest
    container_name: project-builder
    environment:
      # Database connection
      - PB_DB_HOST=postgres
      - PB_DB_PORT=5432
      - PB_DB_NAME=project_builder
      - PB_DB_USER=pb_user
      - PB_DB_PASSWORD=${PB_DB_PASSWORD:-changeme}
      # LLM Provider API keys
      - XAI_API_KEY=${XAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      # Application configuration
      - PB_ENV=production
      - PB_LOG_LEVEL=${PB_LOG_LEVEL:-INFO}
      - PB_LOG_FORMAT=json
      # Prometheus metrics
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=8000
    volumes:
      # Persistent storage for projects and artifacts
      - project-artifacts:/app/projects
      - project-logs:/app/logs
      # Read-only config
      - ./config:/app/config:ro
    ports:
      - "8000:8000"  # Health check + Prometheus metrics
    networks:
      - pb-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
      replicas: 1
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: project-builder-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: project-builder-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - pb-network
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  pb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  project-artifacts:
    driver: local
  project-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
