apiVersion: v1
kind: Service
metadata:
  name: project-builder
  namespace: project-builder
  labels:
    app.kubernetes.io/name: project-builder
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app: project-builder
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
