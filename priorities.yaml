  - id: "naming_refactoring_phase_1"
    title: "Naming Ruleset Refactoring - Phase 1: Discovery & Analysis"
    description: |
      Comprehensive naming audit and impact analysis for codebase-wide refactoring:

      TASK 1: Create naming_audit.py script that scans entire codebase and generates:
      - Directory naming violations (plural names, inconsistent casing, deep nesting)
      - File naming violations (non-snake_case, cryptic names)
      - Function naming violations (no verb-noun pairs, flag arguments, hidden side effects)
      - Variable naming violations (single letters in large scopes, Hungarian notation)
      Output: naming_violations_report.json + naming_violations_summary.md

      TASK 2: Create prioritization matrix:
      - Critical: Public API functions, core entity names (Phase 2)
      - High: Service/use case functions, adapters (Phase 3)
      - Medium: Internal helpers, private methods (Phase 4)
      - Low: Local variables, temporary vars (Phase 5)
      Output: refactoring_priority_matrix.md + phase_*.json goal files

      TASK 3: Impact analysis:
      - Build dependency graph (files importing violated names)
      - Check test coverage for violated names
      - Search documentation for references to old names
      Output: impact_analysis_report.json + breaking_changes_forecast.md

      Reference: REFACTORING_PLAN_NAMING_RULESET.md (complete 6-phase plan)
      Ruleset: Naming Ruleset.md (Clean Code principles by Robert C. Martin)
    status: "completed"
    priority: "high"
    effort_hours: 2.5
    complexity: "medium"

    workflow: null
