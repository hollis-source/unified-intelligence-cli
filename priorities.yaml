  - id: "naming_refactoring_phase_2"
    title: "Naming Ruleset Refactoring - Phase 2: Critical Priority Refactoring"
    description: |
      Execute Phase 2 of naming refactoring: 112 critical priority violations.

      **IMPORTANT**: Follow the detailed execution plan at docs/PHASE_2_EXECUTION_PLAN.md

      Execute in 4 safe sub-phases with backward compatibility:

      PHASE 2A: Variable Renames (1-2 hours, 16 violations)
      - Rename 12 single-letter variables to descriptive names
      - Rename 4 Hungarian notation variables
      - Local scope only - ZERO breaking changes
      - Test: pytest tests/ -v

      PHASE 2B: Function Renames (12-15 hours, 92 violations)
      - Rename 92 functions to verb-noun pattern
      - Create deprecated aliases for backward compatibility
      - Update internal calls to use new names
      - Execute in 4 batches with testing between each
      - Test after each batch: pytest tests/ -v

      PHASE 2C: Directory Renames (6-8 hours, 4 violations)
      - Phase 2C-1: Create compatibility shims (non-breaking)
      - Phase 2C-2: Update ~61 imports to new directory names
      - Directories: src/entities→entity, src/interfaces→interface, etc.
      - Both old and new imports work via shims
      - Test: pytest tests/ -v && manual import tests

      PHASE 2D: Validation & Documentation (2-3 hours)
      - Run full validation suite
      - Update documentation
      - Create Phase 2 completion summary

      **Key Safety Measures:**
      - Backward compatibility via function aliases and directory shims
      - Test after each sub-phase
      - Atomic git commits per sub-phase
      - Rollback procedures documented in execution plan

      **Input Files:**
      - phase_2_goals.json (112 violations)
      - docs/PHASE_2_EXECUTION_PLAN.md (detailed plan)
      - breaking_changes_forecast.md (risk analysis)

      **Expected Output:**
      - Refactoring scripts: refactor_phase_2a.py, refactor_phase_2b.py, create_shims.py, update_all_imports.py
      - Compatibility layers: function aliases, directory shims
      - Phase 2 completion summary
      - All tests passing
      - Zero breaking changes (backward compatible)
